[project]
name = "ewp-transcripts"
version = "0.1.0"
description = "Local-first transcription for edited podcast and training recordings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyannote-audio==4.0.7",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "torchvision==0.23.0",
    "whisperx==3.8.6",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
triton = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
